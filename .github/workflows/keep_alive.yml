name: Keep CosineCinema Active
on:
  schedule:
    - cron: "0 */10 * * *"
  workflow_dispatch:
permissions:
  contents: write


jobs:
  keep_alive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create empty commit
        run: |
          git commit --allow-empty -m "chore:scheduled repo activity"
          git push origin HEAD:main
